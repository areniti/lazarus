{% extends "base.html" %}
{% block title %}خانه - LAZARUS{% endblock %}
{% block content %}
<h1>📁 سایت من</h1>

{% for site in sites %}
<div class="card" style="display:flex;justify-content:space-between;align-items:center;">
    <div>
        <strong>{{ site.name }}</strong>
        <span class="text-muted" style="margin-right:10px;">({{ (site.size/1024)|round(1) }}KB)</span>
    </div>
    <a href="/preview/{{ site.file }}" target="_blank" class="btn btn-sm">👁️ مشاهده</a>
</div>
{% endfor %}

{% if not sites %}
<div class="card text-center">
    <p class="text-muted">هنوز سایتی ساخته نشده</p>
    <a href="/admin/chat" class="btn mt-1">💬 شروع چت</a>
</div>
{% endif %}
{% endblock %}
