{% extends "base.html" %}
{% block title %}Users - Lazarus{% endblock %}
{% block content %}
<h1>👥 صفحه کاربران</h1>
<div class="card">
    {% if sites %}
    {% for site in sites %}
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #30363d;">
        <span>{{ site.name }}</span>
        <a href="/preview/{{ site.file }}" target="_blank" class="btn">مشاهده سایت</a>
    </div>
    {% endfor %}
    {% else %}
    <p style="color: #8b949e; text-align: center; padding: 40px;">هنوز سایتی ساخته نشده</p>
    {% endif %}
</div>
{% endblock %}
