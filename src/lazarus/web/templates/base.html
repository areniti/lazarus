<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Lazarus{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Vazirmatn', sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; }
        .navbar { background: #161b22; border-bottom: 1px solid #30363d; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .navbar a { color: #8b949e; text-decoration: none; margin: 0 12px; font-size: 14px; }
        .navbar a.active, .navbar a:hover { color: #58a6ff; }
        .navbar .brand { color: #58a6ff; font-weight: 700; font-size: 16px; text-decoration: none; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        h1 { color: #58a6ff; margin-bottom: 20px; font-size: 1.5em; }
        h3 { color: #e6edf3; margin-bottom: 12px; font-size: 1.1em; }
        .btn { display: inline-block; padding: 8px 20px; background: #238636; color: white; border: none; border-radius: 8px; font-family: inherit; font-size: 13px; cursor: pointer; text-decoration: none; }
        .btn:hover { background: #2ea043; }
        .btn-blue { background: #1f6feb; }
        .btn-blue:hover { background: #388bfd; }
        .btn-red { background: #da3633; }
        .btn-red:hover { background: #f85149; }
        .btn-sm { padding: 4px 12px; font-size: 12px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
        input, select { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #e6edf3; font-family: inherit; font-size: 14px; margin-bottom: 10px; }
        input:focus, select:focus { outline: none; border-color: #58a6ff; }
        .error { color: #f85149; font-size: 13px; margin-bottom: 10px; }
        .success { color: #3fb950; font-size: 13px; margin-bottom: 10px; }
        .row { display: flex; gap: 10px; align-items: center; }
        .row input { margin-bottom: 0; flex: 1; }
        .text-center { text-align: center; }
        .text-muted { color: #8b949e; font-size: 13px; }
        .mt-1 { margin-top: 8px; }
        .mb-1 { margin-bottom: 8px; }
    </style>
</head>
<body>
    {% block navbar %}
    <nav class="navbar">
        <a href="/" class="brand">🔧 LAZARUS</a>
        <div>
            <a href="/admin" class="{% if request.path == '/admin' %}active{% endif %}">خانه</a>
            <a href="/admin/chat" class="{% if request.path == '/admin/chat' %}active{% endif %}">💬 چت</a>
            <a href="/admin/settings" class="{% if '/settings' in request.path %}active{% endif %}">⚙️ تنظیمات</a>
            <a href="/logout">🚪 خروج</a>
        </div>
    </nav>
    {% endblock %}
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
