<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Lazarus{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --surface-2: #1c1c21;
            --surface-3: #27272a;
            --border: #27272a;
            --border-subtle: #1e1e22;
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
            --text-subtle: #52525b;
            --primary: #818cf8;
            --danger: #ef4444;
            --success: #22c55e;
            --brand-500: #6366f1;
            --brand-700: #4338ca;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Grotesk', 'Vazirmatn', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }
        html { overflow-x: hidden; }

        /* Aurora blobs */
        .bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; }
        .blob { position: absolute; border-radius: 50%; filter: blur(100px); mix-blend-mode: screen; }
        .blob-1 { width: 600px; height: 600px; background: radial-gradient(circle, rgba(99,102,241,0.3) 0%, transparent 70%); top: -200px; right: -150px; animation: blobMove1 8s ease-in-out infinite; }
        .blob-2 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(139,92,246,0.2) 0%, transparent 70%); bottom: -150px; left: -100px; animation: blobMove2 10s ease-in-out infinite; }
        .blob-3 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 70%); top: 30%; left: 40%; animation: blobMove3 12s ease-in-out infinite; }
        .blob-4 { width: 300px; height: 300px; background: radial-gradient(circle, rgba(236,72,153,0.12) 0%, transparent 70%); top: 60%; right: 20%; animation: blobMove4 9s ease-in-out infinite; }
        @keyframes blobMove1 { 0%,100%{transform:translate(0,0) scale(1) rotate(0deg)} 25%{transform:translate(-80px,60px) scale(1.2) rotate(45deg)} 50%{transform:translate(40px,-40px) scale(0.9) rotate(90deg)} 75%{transform:translate(-30px,-80px) scale(1.1) rotate(135deg)} }
        @keyframes blobMove2 { 0%,100%{transform:translate(0,0) scale(1) rotate(0deg)} 33%{transform:translate(100px,-60px) scale(1.3) rotate(-60deg)} 66%{transform:translate(-50px,80px) scale(0.8) rotate(-120deg)} }
        @keyframes blobMove3 { 0%,100%{transform:translate(-50%,-50%) scale(1)} 50%{transform:translate(-50%,-50%) scale(1.4)} }
        @keyframes blobMove4 { 0%,100%{transform:translate(0,0) scale(1)} 25%{transform:translate(60px,-80px) scale(1.2)} 50%{transform:translate(-40px,40px) scale(0.7)} 75%{transform:translate(80px,60px) scale(1.1)} }

        /* Particles */
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .particle { position: absolute; width: 3px; height: 3px; background: rgba(229,106,74,0.5); border-radius: 50%; animation: particleFloat linear infinite; }
        @keyframes particleFloat { 0%{transform:translateY(100vh) scale(0);opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{transform:translateY(-10vh) scale(1);opacity:0} }

        /* Grid */
        .grid-lines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; opacity: 0.03; }
        .grid-lines::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(255,255,255,0.5) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.5) 1px, transparent 1px); background-size: 80px 80px; animation: gridPulse 4s ease-in-out infinite; }
        @keyframes gridPulse { 0%,100%{opacity:0.3} 50%{opacity:0.8} }

        /* Grain */
        .grain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; opacity: 0.04; background: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }

        /* Cursor glow */
        .cursor-glow { position: fixed; width: 300px; height: 300px; background: radial-gradient(circle, rgba(99,102,241,0.08) 0%, transparent 70%); border-radius: 50%; pointer-events: none; z-index: 1; transform: translate(-50%, -50%); transition: transform 0.1s ease-out; }

        /* Header */
        header { position: sticky; top: 0; z-index: 30; border-bottom: 1px solid var(--border-subtle); background: rgba(9,9,11,0.7); backdrop-filter: blur(20px) saturate(180%); height: 56px; animation: headerSlide 0.6s ease-out; }
        @keyframes headerSlide { from{transform:translateY(-100%);opacity:0} to{transform:translateY(0);opacity:1} }
        .header-inner { max-width: 1280px; margin: 0 auto; padding: 0 12px; height: 100%; display: flex; align-items: center; justify-content: space-between; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-logo { width: 32px; height: 32px; background: linear-gradient(135deg, var(--brand-500), var(--brand-700)); border-radius: 8px; display: flex; align-items: center; justify-content: center; animation: logoPulse 3s ease-in-out infinite; }
        @keyframes logoPulse { 0%,100%{box-shadow:0 0 0 0 rgba(99,102,241,0.4)} 50%{box-shadow:0 0 20px 5px rgba(99,102,241,0.2)} }
        .header-logo svg { width: 18px; height: 18px; }
        .header-brand { font-size: 16px; font-weight: 600; }
        .header-nav { display: flex; align-items: center; gap: 8px; }
        .header-nav a { padding: 6px 14px; border-radius: 9999px; font-size: 13px; color: var(--text-muted); text-decoration: none; transition: all 0.3s; position: relative; }
        .header-nav a:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }
        .header-nav a.active { color: var(--primary); background: rgba(99,102,241,0.1); }
        .header-actions { display: flex; gap: 8px; }
        .btn-outline { padding: 7px 14px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--text-main); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.3s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .btn-outline:hover { border-color: var(--text-muted); background: rgba(255,255,255,0.03); }
        .btn-outline svg { width: 14px; height: 14px; }
        @media (max-width: 640px) {
            .btn-outline span { display: none; }
            .btn-outline { padding: 7px 10px; }
            .header-nav a { padding: 6px 10px; font-size: 12px; }
            .header-left { gap: 8px; }
            .logo-wordmark { font-size: 14px; }
            .blob { transform: scale(0.5); }
            .blob-1 { width: 300px; height: 300px; }
            .blob-2 { width: 250px; height: 250px; }
            .blob-3 { width: 200px; height: 200px; }
            .blob-4 { width: 150px; height: 150px; }
        }

        /* Main */
        .main-content { position: relative; z-index: 2; max-width: 1280px; margin: 0 auto; padding: 0 20px; }

        /* Forms */
        input, select, textarea {
            width: 100%; padding: 10px 14px;
            background: var(--surface-2); border: 1px solid var(--border);
            border-radius: 12px; color: var(--text-main);
            font-family: 'Space Grotesk', 'Vazirmatn', sans-serif;
            font-size: 14px; outline: none; transition: all 0.3s ease-out;
        }
        input::placeholder, textarea::placeholder { color: var(--text-subtle); }
        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
            background: rgba(99,102,241,0.03);
        }
        button, .btn {
            padding: 10px 20px; border-radius: 12px;
            font-family: 'Space Grotesk', 'Vazirmatn', sans-serif;
            font-size: 14px; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease-out; border: none;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn { background: var(--brand-500); color: white; }
        .btn:hover { background: var(--brand-700); transform: translateY(-1px); box-shadow: 0 4px 15px rgba(99,102,241,0.4); }
        .btn:active { transform: scale(0.97); }
        .btn-blue { background: var(--brand-500); }
        .btn-blue:hover { background: var(--brand-700); }
        .btn-red { background: var(--danger); }
        .btn-red:hover { background: #dc2626; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .error { color: var(--danger); font-size: 13px; margin-bottom: 10px; }
        .success { color: var(--success); font-size: 13px; margin-bottom: 10px; }
        .card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
        .row { display: flex; gap: 10px; align-items: center; }
        .row input { margin-bottom: 0; flex: 1; }
        .text-center { text-align: center; }
        .text-muted { color: var(--text-muted); font-size: 13px; }
        .mt-1 { margin-top: 8px; }
        .mb-1 { margin-bottom: 8px; }
        h1 { color: var(--primary); margin-bottom: 20px; font-size: 1.5em; }
        h2 { color: var(--text-main); margin-bottom: 12px; font-size: 1.25em; }
        h3 { color: var(--text-main); margin-bottom: 12px; font-size: 1.1em; }
        label { font-size: 13px; font-weight: 500; color: var(--text-main); display: block; margin-bottom: 6px; }
    </style>
</head>
<body>
    <div class="bg-canvas">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>
    <div class="particles" id="particles"></div>
    <div class="grid-lines"></div>
    <div class="grain"></div>
    <div class="cursor-glow" id="cursorGlow"></div>

    <header>
        <div class="header-inner">
            <div class="header-left">
                <div class="header-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                </div>
                <span class="header-brand">LAZARUS</span>
            </div>
            <nav class="header-nav">
                <a href="/" class="{% if request.path == '/' %}active{% endif %}">Home</a>
                <a href="/admin" class="{% if request.path == '/admin' %}active{% endif %}">Dashboard</a>
                <a href="/admin/chat" class="{% if request.path == '/admin/chat' %}active{% endif %}">Chat</a>
                <a href="/admin/settings" class="{% if '/settings' in request.path %}active{% endif %}">Settings</a>
            </nav>
            <div class="header-actions">
                {% if session.get('logged_in') %}
                <a href="/logout" class="btn-outline">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    <span>Sign out</span>
                </a>
                {% endif %}
            </div>
        </div>
    </header>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <script>
        const particlesEl = document.getElementById('particles');
        for (let i = 0; i < 50; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (Math.random() * 15 + 10) + 's';
            p.style.animationDelay = (Math.random() * 15) + 's';
            p.style.width = p.style.height = (Math.random() * 3 + 1) + 'px';
            p.style.opacity = Math.random() * 0.5 + 0.1;
            particlesEl.appendChild(p);
        }
        const glow = document.getElementById('cursorGlow');
        document.addEventListener('mousemove', (e) => { glow.style.left = e.clientX + 'px'; glow.style.top = e.clientY + 'px'; });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
