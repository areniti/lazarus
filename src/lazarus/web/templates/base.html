<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Lazarus{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Vazirmatn', sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        h1 { color: #58a6ff; margin-bottom: 20px; }
        .btn { display: inline-block; padding: 10px 24px; background: #238636; color: white; border: none; border-radius: 8px; font-family: inherit; font-size: 14px; cursor: pointer; text-decoration: none; }
        .btn:hover { background: #2ea043; }
        .btn-blue { background: #1f6feb; }
        .btn-blue:hover { background: #388bfd; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
        input, textarea { width: 100%; padding: 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #e6edf3; font-family: inherit; font-size: 14px; margin-bottom: 12px; }
        input:focus, textarea:focus { outline: none; border-color: #58a6ff; }
        .error { color: #f85149; margin-bottom: 12px; }
        .success { color: #3fb950; margin-bottom: 12px; }
        nav { display: flex; gap: 16px; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid #30363d; }
        nav a { color: #8b949e; text-decoration: none; }
        nav a:hover { color: #58a6ff; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; }
        .badge-green { background: #238636; color: white; }
        .badge-red { background: #da3633; color: white; }
        .badge-yellow { background: #9e6a03; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="/">🏠 صفحه اصلی</a>
            <a href="/admin">⚙️ ادمین</a>
            <a href="/user">👥 کاربران</a>
        </nav>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
