{% extends "base.html" %}
{% block title %}Lazarus{% endblock %}
{% block content %}
{% if sites %}
<div style="padding:0;margin:-20px;">
    {% for site in sites %}
    <iframe src="{{ url_for('preview', filename=site.file) }}" style="width:100%;height:calc(100vh - 60px);border:none;border-radius:12px;"></iframe>
    {% endfor %}
</div>
{% else %}
<div style="text-align:center;padding:100px 0;">
    <h1 style="font-size:64px;color:#58a6ff;margin-bottom:16px;">🔧 L A Z A R U S</h1>
    <p style="color:#8b949e;font-size:18px;">AI-Powered CMS</p>
    <p style="color:#484f58;font-size:14px;margin-top:40px;">هنوز سایتی ساخته نشده</p>
    <a href="/admin" class="btn btn-blue" style="margin-top:20px;">⚙️ پنل ادمین</a>
</div>
{% endif %}
{% endblock %}
