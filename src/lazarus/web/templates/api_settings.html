{% extends "base.html" %}
{% block title %}API - LAZARUS{% endblock %}
{% block content %}
<h1>🌐 مدیریت API</h1>

<div class="card">
    <h3>➕ مدل جدید اضافه کن</h3>
    <input type="text" id="new_name" placeholder="نام (مثلاً: OpenCode)">
    <input type="text" id="new_url" placeholder="Base URL (مثلاً: https://opencode.ai/zen/v1)">
    <input type="text" id="new_key" placeholder="API Key">
    <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="btn btn-blue" onclick="fetchModels()">🔍 دریافت مدل‌ها</button>
        <button class="btn" onclick="addModel()">💾 ذخیره مدل</button>
    </div>
    <div id="status" class="mt-1"></div>
</div>

<div class="card" id="fetched_section" style="display:none;">
    <h3>📋 مدل‌های موجود</h3>
    <input type="text" id="search_fetched" placeholder="جستجو..." oninput="filterFetched()" style="margin-bottom:12px;">
    <div id="fetched_list"></div>
</div>

<div class="card">
    <h3>💾 مدل‌های ذخیره شده</h3>
    <input type="text" id="search_saved" placeholder="جستجو..." oninput="filterSaved()" style="margin-bottom:12px;">
    <div id="saved_list"></div>
</div>

<script>
let fetchedModels = [];
let filteredFetched = [];
let savedModels = [];

function fetchModels() {
    const url = document.getElementById('new_url').value;
    const key = document.getElementById('new_key').value;
    const status = document.getElementById('status');
    if (!url || !key) { status.innerHTML = '<span class="error">URL و Key الزامیه</span>'; return; }
    status.innerHTML = '⏳ در حال دریافت...';
    fetch('/api/fetch-models', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({api_url:url, api_key:key})})
    .then(r=>r.json()).then(d=>{
        if (d.models && d.models.length > 0) {
            fetchedModels = d.models;
            filteredFetched = d.models.slice();
            renderFetched();
            document.getElementById('fetched_section').style.display = 'block';
            status.innerHTML = '<span class="success">✅ ' + d.models.length + ' مدل پیدا شد</span>';
        } else {
            status.innerHTML = '<span class="error">❌ ' + (d.error || 'مدلی پیدا نشد') + '</span>';
        }
    });
}

function renderFetched() {
    const box = document.getElementById('fetched_list');
    if (!filteredFetched.length) { box.innerHTML = '<p class="text-muted">مدلی پیدا نشد</p>'; return; }
    box.innerHTML = filteredFetched.map((m,i) => `
        <div style="padding:8px 12px;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:center;">
            <span>${m}</span>
            <button class="btn btn-sm" onclick="selectFetchedModel('${m.replace(/'/g,"\\'")}')">✅ انتخاب</button>
        </div>
    `).join('');
}

function filterFetched() {
    const q = document.getElementById('search_fetched').value.toLowerCase();
    filteredFetched = fetchedModels.filter(m => m.toLowerCase().includes(q));
    renderFetched();
}

function selectFetchedModel(name) {
    document.getElementById('new_name').value = name;
    document.getElementById('status').innerHTML = '<span class="success">✅ انتخاب شد: ' + name + '</span>';
    window.scrollTo({top: 0, behavior: 'smooth'});
}

function addModel() {
    const name = document.getElementById('new_name').value;
    const url = document.getElementById('new_url').value;
    const key = document.getElementById('new_key').value;
    const status = document.getElementById('status');
    if (!name || !url || !key) { status.innerHTML = '<span class="error">همه فیلدها الزامیه</span>'; return; }
    fetch('/api/add-model', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, url, key})})
    .then(r=>r.json()).then(d=>{
        if (d.ok) {
            status.innerHTML = '<span class="success">✅ ذخیره شد: ' + name + '</span>';
            document.getElementById('new_name').value = '';
            loadSaved();
        } else {
            status.innerHTML = '<span class="error">❌ ' + d.error + '</span>';
        }
    });
}

function loadSaved() {
    fetch('/api/models-list').then(r=>r.json()).then(d=>{
        savedModels = d.models || [];
        renderSaved();
    });
}

function renderSaved() {
    const box = document.getElementById('saved_list');
    if (!savedModels.length) { box.innerHTML = '<p class="text-muted">مدلی ذخیره نشده</p>'; return; }
    box.innerHTML = savedModels.map((m,i) => `
        <div style="padding:12px;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:center;">
            <div>
                <strong>${m.name}</strong><br>
                <span class="text-muted" style="font-size:12px;">${m.url}</span>
            </div>
            <div style="display:flex;gap:6px;">
                <button class="btn btn-sm btn-blue" onclick="testSaved(${i})">🧪 تست</button>
                <button class="btn btn-sm" onclick="useSaved(${i})">✅ فعال کردن</button>
                <button class="btn btn-sm btn-red" onclick="removeSaved(${i})">🗑️</button>
            </div>
        </div>
    `).join('');
}

function filterSaved() {
    const q = document.getElementById('search_saved').value.toLowerCase();
    const filtered = savedModels.filter(m => m.name.toLowerCase().includes(q) || m.url.toLowerCase().includes(q));
    const box = document.getElementById('saved_list');
    if (!filtered.length) { box.innerHTML = '<p class="text-muted">چیزی پیدا نشد</p>'; return; }
    box.innerHTML = filtered.map((m) => {
        const realIndex = savedModels.indexOf(m);
        return `
        <div style="padding:12px;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:center;">
            <div>
                <strong>${m.name}</strong><br>
                <span class="text-muted" style="font-size:12px;">${m.url}</span>
            </div>
            <div style="display:flex;gap:6px;">
                <button class="btn btn-sm btn-blue" onclick="testSaved(${realIndex})">🧪 تست</button>
                <button class="btn btn-sm" onclick="useSaved(${realIndex})">✅ فعال کردن</button>
                <button class="btn btn-sm btn-red" onclick="removeSaved(${realIndex})">🗑️</button>
            </div>
        </div>`;
    }).join('');
}

function testSaved(i) {
    const m = savedModels[i];
    const status = document.getElementById('status');
    status.innerHTML = '⏳ تست ' + m.name + '...';
    fetch('/api/test-model', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({api_url:m.url, api_key:m.key, model:m.name})})
    .then(r=>r.json()).then(d=>{
        status.innerHTML = d.ok ? '<span class="success">✅ ' + m.name + ': ' + d.response + '</span>' : '<span class="error">❌ ' + d.error + '</span>';
    });
}

function useSaved(i) {
    const m = savedModels[i];
    fetch('/api/save-api', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({api_url:m.url, api_key:m.key, api_model:m.name})})
    .then(r=>r.json()).then(d=>{
        document.getElementById('status').innerHTML = d.ok ? '<span class="success">✅ فعال شد: ' + m.name + '</span>' : '<span class="error">❌ ' + d.error + '</span>';
    });
}

function removeSaved(i) {
    fetch('/api/remove-model', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({index:i})})
    .then(r=>r.json()).then(()=>loadSaved());
}

loadSaved();
</script>
{% endblock %}
